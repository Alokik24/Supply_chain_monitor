name: Supply Chain Monitor Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint and test:
    runs-on: ubuntu-latest

    services:
      postgres_db:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U ${{ secrets.POSTGRES_USER }} -d ${{ secrets.POSTGRES_DB }}"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    redis_cache:
      image: redis:7-alpine
      ports:
        - 6379:6379
    
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v3
      
      - name: Set up Python Environement
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
      
      - name: Install core system dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest httpx
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Code Linter (Ruff Compliance Audit)
        run: ruff check src/ tests/

      - name: Apply Database Migrations inside CI
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: my_ultra_secure_password_2026
          POSTGRES_DB: supply_chain_telemetry
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
        run: python -m src.seed_db

      - name: Execute Automated Test Suites (Pytest)
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: my_ultra_secure_password_2026
          POSTGRES_DB: supply_chain_telemetry
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          REDIS_HOST: localhost
          REDIS_PORT: 6379
        run: pytest tests/