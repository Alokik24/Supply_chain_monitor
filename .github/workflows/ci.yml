name: Supply Chain Monitor Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      postgres_db:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: my_ultra_secure_password_2026
          POSTGRES_DB: supply_chain_telemetry
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d supply_chain_telemetry"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis_cache: # 🔧 FIXED: Properly indented under services block
        image: redis:7-alpine
        ports:
          - 6379:6379
    
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
      
      - name: Install core system dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest httpx
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Code Linter (Ruff Compliance Audit)
        run: ruff check src/ tests/

      - name: Apply Database Migrations inside CI
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: my_ultra_secure_password_2026
          POSTGRES_DB: supply_chain_telemetry
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
        run: |
          python data/generate.py
          python -m src.seed_db

      - name: Inspect databases
        env:
          PGPASSWORD: my_ultra_secure_password_2026
        run: |
          psql -h localhost -U postgres -d supply_chain_telemetry -c "\l"

      - name: Execute Automated Test Suites (Pytest)
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: my_ultra_secure_password_2026
          POSTGRES_DB: supply_chain_telemetry
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          REDIS_HOST: localhost
          REDIS_PORT: 6379
        run: pytest tests/